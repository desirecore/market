name: Upstream Health

# Daily check that every external pointer (skills/agents/teams entry.json)
# still resolves upstream. Results go to one tracking issue labelled
# `upstream-health`, which is updated in place and closed once nothing is
# actionable. Fixing an entry stays a normal reviewed PR; this workflow never
# rewrites the default branch. Verified Skill updates get normal PRs; blocked audits remain explicit drafts.

on:
  schedule:
    - cron: "23 1 * * *" # Daily 01:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-health
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'desirecore/market'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Check upstreams
        id: check
        run: |
          set +e
          uv run --quiet scripts/catalog/check_upstream_health.py --format markdown --summary-file summary.json --results-file results.json > report.md
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "health check crashed with exit code $code" >&2
            exit "$code"
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          summary = json.loads(Path("summary.json").read_text())
          for key in ("broken", "actionable", "unknown", "held"):
              print(f"{key}={str(summary[key]).lower()}")
          PY
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONABLE: ${{ steps.check.outputs.actionable }}
          UNKNOWN: ${{ steps.check.outputs.unknown }}
          HELD: ${{ steps.check.outputs.held }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label=upstream-health
          gh label create "$label" --color D93F0B \
            --description "Upstream availability of external catalog entries" 2>/dev/null || true

          {
            echo "_Updated by [Upstream Health]($RUN_URL) on $(date -u +%Y-%m-%d)._"
            echo
            echo "Fix entries through a normal PR: repoint or remove \`gone\` entries, correct \`bad-*\` paths, and review upstream changes before bumping \`source.ref\` for \`outdated\` entries (rerun \`scripts/gen-collection-children.py\` for collections); a reviewed decision to keep the current pin or to leave new upstream children undeclared can be recorded in \`<kind>/<id>/upstream-health-hold.json\`. \`unreachable\` means a network error, not a confirmed failure."
            echo
            cat report.md
          } > body.md

          issue=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$ACTIONABLE" = "true" ] || [ "$UNKNOWN" = "true" ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file body.md
            else
              gh issue create --title "Upstream health report" --label "$label" --body-file body.md
            fi
          elif [ -n "$issue" ]; then
            closing="All external entries resolve upstream and are current as of $RUN_URL."
            if [ "${HELD:-0}" -gt 0 ]; then
              closing="All external entries resolve upstream as of $RUN_URL; $HELD finding(s) remain under reviewed holds (see the run summary)."
            fi
            gh issue comment "$issue" --body "$closing Closing."
            gh issue close "$issue"
          fi

      - name: Propose reviewed-source updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --quiet scripts/catalog/propose_upstream_updates.py results.json --publish --limit 5 --coverage-file coverage.json
      - name: 展示所有技能的覆盖与阻碍
        if: always()
        run: |
          if [ -f coverage.md ]; then cat coverage.md >> "$GITHUB_STEP_SUMMARY"; else echo '覆盖报告未生成，来源核验未完成。' >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Fail when an entry is broken
        if: steps.check.outputs.broken == 'true'
        run: |
          echo "::error::At least one external entry no longer resolves upstream; see the upstream-health issue."
          exit 1
